name: HiddenWord
options:
  bundleIdPrefix: com.jonathan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HiddenWord:
    type: application
    platform: iOS
    sources:
      - path: HiddenWord
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: HiddenWord
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathan.HiddenWord
        INFOPLIST_FILE: HiddenWord/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID here (or pick it in Xcode)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
